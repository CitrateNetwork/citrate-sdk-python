name: Publish Python Package

# Hardenings applied 2026-05-20 per REM-05 (manual GH Actions audit):
# 1. Top-level least-privilege `permissions: contents: read` (was missing).
# 2. Per-job permissions overrides where needed (publish job declares
#    `id-token: write` to enable PyPI trusted-publisher OIDC if/when
#    the project is configured for it on PyPI — see TODO below).
# 3. Bumped actions/upload-artifact + download-artifact v3 → v4
#    (v3 was deprecated by GitHub April 2024; same root cause as
#    REM-01).
# 4. Bumped actions/setup-python v4 → v5.
#
# TODO (separate work, not blocking): migrate from PYPI_API_TOKEN
# to PyPI Trusted Publishers (OIDC). When done, drop `password:`
# from the pypa action input and configure the PyPI project to
# trust this workflow's identity. Reference:
# https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege default for all jobs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy citrate_sdk

    - name: Test with pytest
      run: pytest tests/ -v --cov=citrate_sdk

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # `id-token: write` enables PyPI Trusted Publishers (OIDC) when
    # the project on PyPI is configured for it. Until then the
    # `password:` input is still required; keeping both ready makes
    # the eventual switchover a one-line change.
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        repository-url: https://upload.pypi.org/legacy/