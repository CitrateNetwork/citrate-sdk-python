name: Publish Python Package

# Hardenings applied 2026-05-20 per REM-05 (manual GH Actions audit):
# 1. Top-level least-privilege `permissions: contents: read` (was missing).
# 2. Publish uses PyPI Trusted Publishing (OIDC, `id-token: write` on the
#    publish job only); there is no long-lived PyPI API token.
# 3. Bumped actions/upload-artifact + download-artifact v3 → v4.
# 4. Bumped actions/setup-python v4 → v5.
# 5. The test job runs the same frozen uv.lock environment as CI's
#    locked-env job (Python 3.11), so a release is gated on exactly what CI gates.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege default for all jobs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: python -m pip install "uv==0.12.19"

    # Same locked environment as CI's locked-env job, so the release is
    # tested against exactly the dependency set in uv.lock.
    - name: Install from uv.lock (frozen)
      run: uv sync --frozen --all-extras --python 3.11

    - name: Lint (ruff)
      run: uv run --frozen ruff check .

    - name: Type-check (mypy)
      run: uv run --frozen mypy .

    - name: Test (pytest, locked dependencies)
      run: uv run --frozen pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    # PBA-L6b-003: refuse to publish a wheel whose deploy_model calldata can
    # rebuild the model key. Runs against the built wheel, not the source tree.
    - name: Key-share leak tripwire (built wheel)
      run: |
        pip install -e .
        python scripts/check_keyshare_wheel.py dist/*.whl

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # PyPI Trusted Publishing (OIDC): no API token. The PyPI project trusts
    # CitrateNetwork/citrate-sdk-python, workflow publish.yml.
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/